---
layout: default
---

<main class="blog-post">
  <a class="back-link" href="{{ '/#research' | relative_url }}">
    ← Back to research
  </a>

  <header class="blog-header">
    <p class="eyebrow">{{ page.category | upcase }}</p>
    <h1>{{ page.title }}</h1>

    {% if page.description %}
      <p class="blog-description">{{ page.description }}</p>
    {% endif %}

    <div class="blog-meta">
      <span>Published {{ page.date | date: "%d %B %Y" }}</span>
      {% if page.read_time %}
        <span>{{ page.read_time }} min read</span>
      {% endif %}
    </div>
  </header>

  <article class="blog-content">
    {{ content }}
  </article>
</main>
