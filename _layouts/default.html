<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: site.description | escape }}" />
  <title>
    {% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}
  </title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="logo" href="{{ '/' | relative_url }}">
        CYB3RW1N3<span class="cursor">_</span>
      </a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a
          href="https://github.com/{{ site.github_username }}"
          target="_blank"
          rel="noreferrer"
        >
          GitHub
        </a>
      </nav>
    </header>

    {{ content }}

    <footer>
      <span>© {{ "now" | date: "%Y" }} CYB3RW1N3</span>
      <span>Hosted on GitHub Pages</span>
    </footer>
  </div>
</body>
</html>
